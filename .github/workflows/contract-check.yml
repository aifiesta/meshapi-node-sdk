name: contract-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install and build SDK
        run: npm ci && npm run build

      - name: Install gate
        run: pip install "meshapi-contract @ git+https://github.com/aifiesta/meshapi-contract.git@dd520251424f9e204c41ea20a1aa3189b96958d5"

      - name: Dump SDK surface
        run: node --import tsx/esm scripts/dump-surface.ts > actual.json

      - name: Check drift
        run: python -m meshapi_contract.gate --spec contract/openapi.public.json --actual actual.json --spec-version "$(cat .meshapi-spec-version)" --baseline contract-baseline.json

      - name: Acceptance tests
        env:
          REQUIRE_CONTRACT_GATE: "1"
        run: node --import tsx/esm --test tests/contract-check.test.ts
