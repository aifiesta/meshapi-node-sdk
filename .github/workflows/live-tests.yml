# Node.js SDK — Live Tests

name: Live Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:            # run on PRs to any base (feature-branch stacks included)
  workflow_dispatch:
  schedule:
    # Staging canary (MESH-368). The MESHAPI_* secrets already point at staging,
    # so this run exercises the live staging API on a fixed cadence — independent
    # of whether anyone opened a PR. One cadence: the full suite, once a day.
    # GitHub cron is UTC-only, so 11:00 IST is expressed as 05:30 UTC.
    - cron: "30 5 * * *"   # daily 11:00 IST — full live suite (gates nothing; report-only)

env:
  # Secrets (set in repo → Settings → Secrets and variables → Actions → Secrets)
  MESHAPI_BASE_URL: ${{ secrets.MESHAPI_BASE_URL }}
  MESHAPI_TOKEN: ${{ secrets.MESHAPI_TOKEN }}
  # Core models — safe non-secret defaults.
  MESHAPI_MODEL: "openai/gpt-4o-mini"
  MESHAPI_EMBEDDINGS_MODEL: "openai/text-embedding-3-small"
  MESHAPI_SECOND_MODEL: "anthropic/claude-haiku-4.5"
  MESHAPI_REALTIME_MODEL: "openai/gpt-realtime-mini"
  MESHAPI_IMAGE_URL: "https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg"
  # Feature models — inlined (non-secret). Video generation and audio *input*
  # are intentionally left unset: video is costly, and a synthetic audio clip is
  # rejected by the provider (audio round-trip is covered elsewhere). Strict off.
  MESHAPI_IMAGE_GEN_MODEL: "openai/gpt-image-1"
  MESHAPI_IMAGE_EDIT_MODEL: "openai/gpt-image-1"
  MESHAPI_AUDIO_OUT_MODEL: "openai/gpt-audio-mini"

jobs:
  live-test:
    name: Node.js SDK Live Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SDK source (including tests)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Build SDK
        run: npm ci && npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Install live-test dependencies
        working-directory: livetests
        run: npm install

      # Gating where safe (MESH-368): PRs and pushes run the cheap SMOKE subset
      # (models list, one chat, embeddings/responses, one stream, 401/404) so
      # they gate reliably green — the full suite includes slow/flaky calls
      # (image generation, realtime WebSocket) that intermittently exceed
      # provider latency and shouldn't block unrelated PRs. The FULL suite
      # still runs, just not as a PR gate: on the daily staging cron and on
      # manual workflow_dispatch (e.g. to investigate or confirm a fix).
      - name: Determine suite mode
        id: mode
        if: always()   # compute even if an earlier step failed, so summary/alert still show the suite
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=full" >> "$GITHUB_OUTPUT"
          else
            echo "value=smoke" >> "$GITHUB_OUTPUT"
          fi

      - name: Run live tests (${{ steps.mode.outputs.value }})
        working-directory: livetests
        run: |
          if [ "${{ steps.mode.outputs.value }}" = "smoke" ]; then
            npm run test:smoke
          else
            npm run test:all
          fi

      - name: Write job summary
        if: always()
        run: |
          echo "## 🟨 Node.js SDK Live Test Results" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }}${{ github.event.schedule && format(' (`{0}`)', github.event.schedule) || '' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | ${{ steps.mode.outputs.value }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node | 22 |" >> $GITHUB_STEP_SUMMARY
          echo "| Base URL | \`${{ env.MESHAPI_BASE_URL }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Model | \`${{ env.MESHAPI_MODEL }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ *Node.js SDK Live Tests* — ${{ job.status }} · ${{ steps.mode.outputs.value }} suite\nTrigger: `${{ github.event_name }}${{ github.event.schedule && format(' {0}', github.event.schedule) || '' }}` · Base URL: `${{ env.MESHAPI_BASE_URL }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run> · ${{ github.head_ref || github.ref_name }}"
            }
